name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: seatlock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatlock" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: test-only-secret
      DATABASE_URL: postgres://seatlock:local-test-only@localhost:5432/seatlock_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
        working-directory: api
      - run: uv run pytest -m "not stress"
        working-directory: api
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run start > /tmp/seatlock-next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/login > /dev/null && break; sleep 2; done
          npx playwright test
